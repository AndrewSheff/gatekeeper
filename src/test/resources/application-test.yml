spring:
  datasource:
    url: jdbc:h2:mem:gatekeeper_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: true

  data:
    redis:
      host: localhost
      port: 16379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # JWT decoder предоставляется бином AuthorizationServerConfig

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.ashevtsov.gatekeeper: INFO
